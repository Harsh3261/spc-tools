<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Q Command">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Quality Command</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icon-180.png">
<!--
  Quality Command — a management representative's desk for an ISO 9001 QMS:
  corrective actions (CAPA), internal audit programme, due dates, management
  review pack, quality objectives, ISO 9001:2026 transition and an audit
  readiness check. Everything is stored in this browser on this device only
  (localStorage "qc.data"); there is no server and no network request.
  Logic that decides dates and the readiness score lives in the QCMD block
  and is tested by ../tests/command.e2e.js.
-->
<style>
  :root{
    --bg:#121417; --bg2:#181B20; --panel:#1E2229; --panel2:#262B33; --line:#323944; --line-soft:#2A3038;
    --ink:#E9EDF2; --ink-dim:#AEB6C2; --ink-faint:#7D8794;
    --blue:#2563EB; --blue-h:#1D4ED8; --blue-t:#60A5FA;
    --green:#22C55E; --green-ink:#86EFAC; --amber:#F59E0B; --amber-ink:#FCD34D; --red:#EF4444; --red-ink:#FCA5A5;
    --r:12px; --pad:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; -webkit-text-size-adjust:100%}
  body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  button,input,select,textarea{font:inherit; color:inherit}
  header{padding:calc(14px + env(safe-area-inset-top)) var(--pad) 8px; position:relative}
  header::before{content:""; position:absolute; left:var(--pad); right:var(--pad); top:calc(6px + env(safe-area-inset-top)); height:2px; background:var(--blue); border-radius:2px}
  .brand{display:flex; align-items:center; gap:10px; margin-top:6px}
  .brand svg{width:30px; height:30px; flex-shrink:0}
  .brand h1{font-size:21px; margin:0; letter-spacing:.2px}
  .brand h1 span{color:var(--blue-t)}
  .tag{font-size:12.5px; color:var(--ink-faint); margin:4px 0 0}
  main{padding:0 var(--pad); max-width:900px; margin:0 auto}
  .view{display:none} .view.on{display:block}
  h2{font-size:19px; margin:18px 0 10px}
  h3{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-dim); margin:20px 0 8px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin:10px 0}
  .muted{color:var(--ink-faint)} .small{font-size:13.5px; color:var(--ink-dim); line-height:1.45}
  .row{display:flex; gap:10px; align-items:center} .row > *{flex:1} .wrap{flex-wrap:wrap}
  .btn{appearance:none; border:1px solid var(--line); background:var(--panel2); border-radius:10px; padding:11px 14px; min-height:44px; cursor:pointer; font-weight:600; font-size:15px}
  .btn.pri{background:var(--blue); border-color:var(--blue); color:#fff} .btn.pri:active{background:var(--blue-h)}
  .btn.danger{color:var(--red-ink); border-color:#5a2a2a}
  .btn.sm{min-height:36px; padding:7px 11px; font-size:14px}
  .btns{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  label.f{display:block; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-dim); margin:12px 0 5px}
  input[type=text],input[type=date],input[type=number],select,textarea{width:100%; background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:11px 12px; min-height:44px; font-size:16px}
  textarea{min-height:84px; resize:vertical; line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-t); outline-offset:1px}
  nav.bottom{position:fixed; left:0; right:0; bottom:0; background:rgba(18,20,23,.96); border-top:1px solid var(--line); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:20; backdrop-filter:blur(8px)}
  nav.bottom button{flex:1; background:none; border:0; color:var(--ink-faint); padding:6px 2px; border-radius:10px; font-size:12px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:52px; position:relative}
  nav.bottom button svg{width:22px; height:22px}
  nav.bottom button[aria-current="page"]{color:#fff; background:var(--blue)}
  nav.bottom .badge{position:absolute; top:3px; right:calc(50% - 22px); background:var(--red); color:#fff; font-size:10.5px; min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px}
  /* readiness gauge */
  .gauge{display:flex; gap:16px; align-items:center}
  .gauge svg{width:118px; height:118px; flex-shrink:0}
  .gauge .num{font-size:34px; font-weight:800; font-family:var(--mono)}
  .pill{display:inline-block; font-size:12px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--panel2); color:var(--ink-dim); border:1px solid var(--line)}
  .pill.red{color:var(--red-ink); border-color:#6b2b2b; background:#2a1717} .pill.amber{color:var(--amber-ink); border-color:#6b5320; background:#2a2312} .pill.green{color:var(--green-ink); border-color:#1f5a35; background:#11251a} .pill.blue{color:#cfe0ff; border-color:#2b4a8a; background:#16233d}
  .item{display:flex; gap:12px; align-items:flex-start; padding:12px 2px; border-bottom:1px dashed var(--line-soft); cursor:pointer}
  .item:last-child{border-bottom:0}
  .item .t{font-weight:600; line-height:1.3} .item .s{font-size:13px; color:var(--ink-dim); margin-top:3px; line-height:1.35}
  .item .r{margin-left:auto; text-align:right; flex-shrink:0}
  .dot{width:10px; height:10px; border-radius:50%; margin-top:6px; flex-shrink:0; background:var(--ink-faint)}
  .dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)} .dot.blue{background:var(--blue-t)}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .stat{background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:10px}
  .stat .k{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint)} .stat .v{font-size:22px; font-weight:800; font-family:var(--mono); margin-top:2px}
  .stage{display:flex; gap:3px; margin-top:8px} .stage i{flex:1; height:5px; border-radius:3px; background:var(--line)} .stage i.on{background:var(--blue-t)}
  .seg{display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 4px} .seg button{min-height:38px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel2); font-size:14px; font-weight:600; color:var(--ink-dim)} .seg button[aria-pressed="true"]{background:var(--blue); border-color:var(--blue); color:#fff}
  .empty{padding:18px 4px; color:var(--ink-faint); font-size:14.5px}
  /* bottom sheet */
  .sheet-bg{position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; display:none}
  .sheet{position:fixed; left:0; right:0; bottom:0; max-height:92vh; overflow:auto; background:var(--panel); border-top-left-radius:18px; border-top-right-radius:18px; border:1px solid var(--line); z-index:41; padding:8px var(--pad) calc(18px + env(safe-area-inset-bottom)); display:none; max-width:900px; margin:0 auto}
  .sheet.on,.sheet-bg.on{display:block}
  .sheet .grab{width:44px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 6px}
  .sheet h2{margin-top:6px}
  .sub{border:1px solid var(--line-soft); border-radius:10px; padding:10px; margin-top:8px; background:var(--bg2)}
  .why{display:flex; gap:8px; align-items:center; margin-top:6px} .why b{font-family:var(--mono); color:var(--blue-t); width:34px; flex-shrink:0; font-size:13px}
  .q{padding:10px 0; border-bottom:1px dashed var(--line-soft)} .q:last-child{border-bottom:0}
  .q .qt{font-size:14.5px; line-height:1.35} .q .seg{margin-top:6px}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); background:#0b0d10; border:1px solid var(--line); color:var(--ink); padding:10px 16px; border-radius:10px; z-index:60; font-size:14.5px; display:none; max-width:90vw}
  .toast.on{display:block}
  .banner{border:1px solid #6b5320; background:#2a2312; color:var(--amber-ink); border-radius:10px; padding:10px 12px; font-size:14px; margin:10px 0}
  .banner.blue{border-color:#2b4a8a; background:#16233d; color:#cfe0ff}
  table.t{width:100%; border-collapse:collapse; font-size:14px} table.t th,table.t td{padding:8px 6px; border-bottom:1px solid var(--line-soft); text-align:left; vertical-align:top} table.t th{color:var(--ink-dim); font-size:12px; text-transform:uppercase; letter-spacing:.05em}
  .bar{height:8px; background:var(--line); border-radius:4px; overflow:hidden} .bar i{display:block; height:100%; background:var(--blue-t)}
  .print-only{display:none}
  @media (min-width:700px){ .stats{grid-template-columns:repeat(6,1fr)} }
  /* management review report on paper */
  @media print{
    :root{--bg:#fff; --bg2:#fff; --panel:#fff; --panel2:#fff; --line:#999; --line-soft:#ccc; --ink:#000; --ink-dim:#222; --ink-faint:#444; --blue-t:#1d4ed8}
    body{padding:0; background:#fff}
    header, nav.bottom, .view, .sheet, .sheet-bg, .toast, .noprint{display:none !important}
    #printArea{display:block !important}
    #printArea h1{font-size:18pt; margin:0 0 4pt} #printArea h2{font-size:13pt; margin:14pt 0 4pt; border-bottom:1px solid #999} #printArea p,#printArea li,#printArea td,#printArea th{font-size:10.5pt}
    #printArea table{width:100%; border-collapse:collapse} #printArea td,#printArea th{border:1px solid #999; padding:3pt 5pt; text-align:left}
  }
  #printArea{display:none}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="#323944" stroke-width="4"/><path d="M16 3 A13 13 0 1 1 4.6 22.2" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M11 16.5l3.4 3.4L21.5 12" fill="none" stroke="#60A5FA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>Quality <span>Command</span></h1><p class="tag">Your QMS desk · stored on this device only</p></div>
  </div>
</header>
<main>
  <section class="view on" id="v-today" aria-label="Today"></section>
  <section class="view" id="v-capa" aria-label="Corrective actions"></section>
  <section class="view" id="v-audit" aria-label="Audits"></section>
  <section class="view" id="v-due" aria-label="Due dates"></section>
  <section class="view" id="v-review" aria-label="Review"></section>
</main>
<div id="printArea"></div>
<nav class="bottom" aria-label="Sections">
  <button data-view="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today<span class="badge" id="bToday" hidden></span></button>
  <button data-view="capa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12l5 5L20 6"/></svg>CAPA<span class="badge" id="bCapa" hidden></span></button>
  <button data-view="audit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Audits<span class="badge" id="bAudit" hidden></span></button>
  <button data-view="due"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Due<span class="badge" id="bDue" hidden></span></button>
  <button data-view="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg>Review</button>
</nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* @@QCMD BEGIN — dates, statuses and the readiness score (pure, tested) */
var QCMD = (function(){
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  /* local calendar date, never UTC — "today" must match the wall clock */
  function today(d){ d = d || new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parse(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
  function addDays(iso, n){ var d = parse(iso); if(!d) return ""; d.setDate(d.getDate() + n); return today(d); }
  /* add months, clamping to the month's last day (Jan 31 + 1 month = Feb 28/29) */
  function addMonths(iso, n){
    var d = parse(iso); if(!d) return "";
    var y = d.getFullYear(), m = d.getMonth() + n, day = d.getDate();
    var last = new Date(y, m + 1, 0).getDate();
    return today(new Date(y, m, Math.min(day, last)));
  }
  function days(a, b){ var A = parse(a), B = parse(b); if(!A || !B) return null; return Math.round((B - A) / 86400000); }
  function nextDue(last, months){ return last ? addMonths(last, months) : null; }
  /* CAPA stage: 0 contain · 1 root cause · 2 action · 3 verify · 4 effectiveness · 5 done */
  function capaStage(c){
    if(c.closed){ return c.effResult === "effective" ? 5 : 4; }
    var acts = c.actions || [];
    if(acts.length && acts.every(function(a){ return a.done; })) return 3;
    if((c.rootCause || "").trim()) return 2;
    if((c.containment || "").trim()) return 1;
    return 0;
  }
  var STAGES = ["Contain","Root cause","Action","Verify","Effectiveness check","Closed — effective"];
  /* Readiness: what an auditor would pick on. Points are a rule of thumb for
     priority, not a grade from any standard. Returns {score, items}. */
  function readiness(D, now){
    now = now || today();
    var items = [], add = function(pts, sev, title, sub, go){ items.push({ pts:pts, sev:sev, title:title, sub:sub, go:go }); };
    (D.capas || []).forEach(function(c){
      var st = capaStage(c), lab = (c.no || "CAPA") + " · " + (c.title || "untitled");
      if(!c.closed){
        if(c.due && days(c.due, now) > 0) add(8, "red", "Overdue corrective action", lab + " — due " + c.due + " (" + days(c.due, now) + " days late)", "capa:" + c.id);
        else if(st < 2 && c.opened && days(c.opened, now) > 30) add(4, "amber", "No root cause after 30 days", lab, "capa:" + c.id);
        (c.actions || []).forEach(function(a){ if(!a.done && a.due && days(a.due, now) > 0) add(3, "amber", "Action step overdue", lab + " — " + (a.text || "step") + (a.owner ? " (" + a.owner + ")" : ""), "capa:" + c.id); });
      } else if(c.effResult === "not effective"){
        add(8, "red", "Action was not effective — reopen it", lab, "capa:" + c.id);
      } else if(c.effResult !== "effective"){
        if(c.effDue && days(c.effDue, now) > 0) add(5, "red", "Effectiveness check overdue", lab + " — due " + c.effDue, "capa:" + c.id);
      }
    });
    (D.program || []).forEach(function(p){
      var nd = p.last ? nextDue(p.last, p.freq) : null;
      if(!p.last) add(6, "red", "Never audited", p.area + (p.clauses ? " · " + p.clauses : ""), "audit:" + p.id);
      else if(days(nd, now) > 0) add(6, "red", "Internal audit overdue", p.area + " — due " + nd, "audit:" + p.id);
    });
    (D.audits || []).forEach(function(a){
      (a.findings || []).forEach(function(f){
        if((f.type === "Major NC" || f.type === "Minor NC") && !f.capaId) add(5, "red", "Audit finding with no corrective action", a.area + " " + a.date + " — " + f.type + ": " + (f.text || ""), "finding:" + a.id + ":" + f.id);
      });
    });
    (D.dues || []).forEach(function(d){
      var nd = nextDue(d.last, d.freq);
      if(!nd) add(3, "amber", (d.kind || "Item") + " has no last date", d.name, "due:" + d.id);
      else if(days(nd, now) > 0) add(d.kind === "Calibration" ? 6 : 4, "red", (d.kind || "Item") + " overdue", d.name + " — due " + nd, "due:" + d.id);
    });
    var lastMr = D.mrLast;
    if(!lastMr) add(15, "red", "No management review on record", "ISO 9001 expects planned reviews — record your last one or hold one", "review");
    else if(days(addMonths(lastMr, 12), now) > 0) add(15, "red", "Management review older than 12 months", "Last held " + lastMr, "review");
    (D.objectives || []).forEach(function(o){
      if(o.actual === "" || o.actual === null || o.actual === undefined) add(2, "amber", "Quality objective has no current result", o.name, "review");
    });
    items.sort(function(a, b){ return b.pts - a.pts; });
    var total = items.reduce(function(s, i){ return s + i.pts; }, 0);
    return { score: Math.max(0, 100 - total), items: items };
  }
  function objectiveMet(o){
    var a = Number(o.actual), t = Number(o.target);
    if(o.actual === "" || o.actual === null || !isFinite(a) || !isFinite(t)) return null;
    return o.dir === "max" ? a <= t : a >= t;
  }
  return { today:today, addDays:addDays, addMonths:addMonths, days:days, nextDue:nextDue, capaStage:capaStage, STAGES:STAGES, readiness:readiness, objectiveMet:objectiveMet };
})();
/* @@QCMD END */

(function(){
  var KEY = "qc.data";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]; }); }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  var T = QCMD.today;
  /* ------------ data ------------ */
  function blank(){
    return { v:1, capas:[], program:[], audits:[], dues:[], objectives:[], mrLast:"", mrHistory:[], mrDraft:{}, transition:{}, backupAt:"", seq:{} };
  }
  var D;
  function load(){
    try{ D = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ D = null; }
    if(!D || typeof D !== "object") D = blank();
    var b = blank(); Object.keys(b).forEach(function(k){ if(D[k] === undefined) D[k] = b[k]; });
  }
  var storageOk = true;
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(D)); storageOk = true; }catch(e){ storageOk = false; toast("Could not save — this browser is blocking storage."); } render(); }
  function nextNo(prefix){ var y = T().slice(0,4), k = prefix + y; D.seq[k] = (D.seq[k] || 0) + 1; return prefix + "-" + y + "-" + String(D.seq[k]).padStart(3, "0"); }
  function toast(m){ var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2600); }
  function pill(sev, txt){ return '<span class="pill ' + sev + '">' + esc(txt) + '</span>'; }
  function rel(iso){ if(!iso) return ""; var d = QCMD.days(T(), iso); return d === 0 ? "today" : d > 0 ? "in " + d + " day" + (d===1?"":"s") : Math.abs(d) + " day" + (d===-1?"":"s") + " late"; }
  function dueSev(iso, soon){ if(!iso) return "amber"; var d = QCMD.days(T(), iso); return d < 0 ? "red" : d <= (soon || 14) ? "amber" : "green"; }

  /* ------------ navigation ------------ */
  var view = "today";
  function go(v){
    view = v;
    document.querySelectorAll(".view").forEach(function(s){ s.classList.toggle("on", s.id === "v-" + v); });
    document.querySelectorAll("nav.bottom button").forEach(function(b){ if(b.dataset.view === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    render(); window.scrollTo(0, 0);
  }
  document.querySelector("nav.bottom").addEventListener("click", function(e){ var b = e.target.closest("button[data-view]"); if(b) go(b.dataset.view); });

  /* ------------ sheet (forms) ------------ */
  function openSheet(html){ $("sheetBody").innerHTML = html; $("sheet").classList.add("on"); $("sheetBg").classList.add("on"); $("sheet").scrollTop = 0; document.body.style.overflow = "hidden"; }
  function closeSheet(){ $("sheet").classList.remove("on"); $("sheetBg").classList.remove("on"); document.body.style.overflow = ""; }
  $("sheetBg").addEventListener("click", closeSheet);
  function val(id){ var e = $(id); return e ? e.value.trim() : ""; }

  /* ------------ TODAY ------------ */
  function gaugeSVG(score){
    var r = 50, c = 2 * Math.PI * r, col = score >= 85 ? "#22C55E" : score >= 65 ? "#F59E0B" : "#EF4444";
    return '<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#2A3038" stroke-width="12"/>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * score / 100) + ' ' + c + '" transform="rotate(-90 60 60)"/>' +
      '<text x="60" y="68" text-anchor="middle" fill="#E9EDF2" font-size="30" font-weight="800" font-family="ui-monospace,Menlo,monospace">' + score + '</text></svg>';
  }
  function upcoming(){
    var now = T(), list = [];
    D.capas.forEach(function(c){
      if(!c.closed && c.due) list.push({ date:c.due, t:(c.no || "CAPA") + " due", s:c.title, go:"capa:" + c.id });

        break;
      }
      case "mrLastSet": openSheet('<h2>Last management review</h2><label class="f" for="mLast">Date</label><input type="date" id="mLast" value="' + esc(D.mrLast) + '"><div class="btns"><button class="btn pri" data-act="mrLastSave">Save</button><button class="btn" data-act="close">Cancel</button></div>'); break;
      case "mrLastSave": D.mrLast = val("mLast"); closeSheet(); save(); break;
      case "backup": backup(); break;
      case "restore": $("restoreFile").click(); break;
      case "capaCsv": capaCsv(); break;
      case "wipe": if(confirm("Delete ALL Quality Command data from this device? Make a backup first if you may need it.") && confirm("Really delete everything?")){ D = blank(); save(); toast("Everything deleted from this device."); } break;
    }
  });
  function recCollectChecks(){ /* checks are kept live in recForm.cur.checks */ }
  function objForm(o){
    var isNew = !o; o = o || { id:uid(), name:"", target:"", actual:"", unit:"", dir:"min" };
    openSheet('<h2>' + (isNew ? "Quality objective" : esc(o.name)) + '</h2><label class="f" for="oName">Objective</label><input type="text" id="oName" value="' + esc(o.name) + '" placeholder="e.g. Scrap cost per week">' +
      '<div class="row"><div><label class="f" for="oDir">Good is</label><select id="oDir"><option value="min"' + (o.dir==="min"?" selected":"") + '>at least (≥)</option><option value="max"' + (o.dir==="max"?" selected":"") + '>at most (≤)</option></select></div><div><label class="f" for="oTarget">Target</label><input type="number" step="any" id="oTarget" value="' + esc(o.target) + '"></div></div>' +
      '<div class="row"><div><label class="f" for="oActual">Current result</label><input type="number" step="any" id="oActual" value="' + esc(o.actual) + '"></div><div><label class="f" for="oUnit">Unit</label><input type="text" id="oUnit" value="' + esc(o.unit) + '" placeholder="%, $, ppm"></div></div>' +
      '<div class="btns"><button class="btn pri" data-act="objSave">Save</button>' + (!isNew ? '<button class="btn danger" data-act="objDel" data-id="' + o.id + '">Delete</button>' : '') + '<button class="btn" data-act="close">Cancel</button></div>');
    objForm.cur = o;
  }
  function trForm(k){
    var t = D.transition[k] || {}; trForm.k = k;
    openSheet('<h2>' + esc(k) + '</h2><label class="f" for="tS">Status</label><select id="tS"><option value="">Not started</option><option value="wip"' + (t.s==="wip"?" selected":"") + '>In progress</option><option value="done"' + (t.s==="done"?" selected":"") + '>Done</option></select>' +
      '<label class="f" for="tN">Gaps found / actions</label><textarea id="tN" placeholder="What changed for this clause, and what you need to update">' + esc(t.n || "") + '</textarea>' +
      '<div class="btns"><button class="btn pri" data-act="trSave">Save</button><button class="btn" data-act="close">Cancel</button></div>');
  }
  function bulkForm(){
    openSheet('<h2>Paste a list</h2><p class="small">One item per line: <b>type, name, every-months, last-done date (yyyy-mm-dd), owner</b>. Paste straight from Excel (tab-separated works too). Types: ' + KINDS.join(", ") + '.</p>' +
      '<textarea id="bulkTxt" style="min-height:160px" placeholder="Calibration, Bore gauge BG-12, 6, 2026-07-14, Harsh&#10;Document review, QP-08 Control of NC product, 24, 2025-03-01"></textarea>' +
      '<div class="btns"><button class="btn pri" data-act="bulkSave">Add</button><button class="btn" data-act="close">Cancel</button></div><div id="bulkMsg" class="small"></div>');
  }
  function bulkSave(){
    var lines = val("bulkTxt").split(/\r?\n/).filter(Boolean), add = [], bad = [];
    lines.forEach(function(l, i){
      var c = l.split(/\t|,/).map(function(x){ return x.trim(); });
      var kind = KINDS.filter(function(k){ return k.toLowerCase() === (c[0] || "").toLowerCase(); })[0], freq = parseInt(c[2], 10), last = c[3] || "";
      if(!kind || !c[1] || !(freq > 0) || (last && !/^\d{4}-\d{2}-\d{2}$/.test(last))){ bad.push(i + 1); return; }
      add.push({ id:uid(), kind:kind, name:c[1], freq:freq, last:last, owner:c[4] || "", notes:"" });
    });
    if(bad.length){ $("bulkMsg").textContent = "Line" + (bad.length>1?"s ":" ") + bad.join(", ") + " could not be read — check type, months and date (yyyy-mm-dd). Nothing was added."; return; }
    D.dues = D.dues.concat(add); closeSheet(); save(); toast(add.length + " item" + (add.length===1?"":"s") + " added.");
  }
  function download(name, text, type){
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type:type })); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function backup(){
    D.backupAt = new Date().toISOString();
    download("quality-command-backup-" + T() + ".json", JSON.stringify(D, null, 1), "application/json");
    save(); toast("Backup downloaded. Keep it somewhere safe (it holds your records).");
  }
  document.addEventListener("change", function(e){
    if(e.target.id !== "restoreFile" || !e.target.files.length) return;
    var r = new FileReader();
    r.onload = function(){
      var x = null; try{ x = JSON.parse(r.result); }catch(err){}
      if(!x || !Array.isArray(x.capas) || !Array.isArray(x.dues)){ toast("That is not a Quality Command backup file."); return; }
      if(!confirm("Replace the data on this device with this backup (" + x.capas.length + " corrective actions, " + x.dues.length + " due items)?")) return;
      D = x; var b = blank(); Object.keys(b).forEach(function(k){ if(D[k] === undefined) D[k] = b[k]; }); save(); toast("Restored.");
    };
    r.readAsText(e.target.files[0]); e.target.value = "";
  });
  function capaCsv(){
    var q = function(s){ s = String(s === undefined || s === null ? "" : s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    var L = ["No,Title,Source,Owner,Opened,Due,Stage,Closed,Effectiveness due,Effectiveness result,Root cause,Actions"];
    D.capas.forEach(function(c){ L.push([c.no, c.title, c.source, c.owner, c.opened, c.due, QCMD.STAGES[QCMD.capaStage(c)], c.closed, c.effDue, c.effResult, c.rootCause, (c.actions||[]).map(function(a){ return a.text + (a.done ? " [done]" : ""); }).join(" | ")].map(q).join(",")); });
    download("corrective-actions-" + T() + ".csv", L.join("\n"), "text/csv");
  }
  /* example data — clearly made up — so the app can be tried before real use */
  function sample(){
    var t = T(), A = QCMD.addDays, M = QCMD.addMonths;
    D.program = [
      { id:uid(), area:"Machining – CNC cells", clauses:"7.1.5, 8.5.1, 8.7", freq:12, last:M(t, -13) },
      { id:uid(), area:"Receiving inspection", clauses:"8.4, 8.6", freq:12, last:M(t, -5) },
      { id:uid(), area:"Calibration control", clauses:"7.1.5", freq:12, last:"" }
    ];
    D.dues = [
      { id:uid(), kind:"Calibration", name:"Example bore gauge BG-1", owner:"", freq:6, last:M(t, -7), notes:"" },
      { id:uid(), kind:"Calibration", name:"Example CMM", owner:"", freq:12, last:M(t, -2), notes:"" },
      { id:uid(), kind:"Document review", name:"Example procedure QP-01", owner:"", freq:24, last:M(t, -23), notes:"" },
      { id:uid(), kind:"Training", name:"Example: operator first-piece approval", owner:"", freq:12, last:M(t, -3), notes:"" }
    ];
    var c1 = { id:uid(), no:"", title:"Example: bore oversize after tool change", source:"NCR / scrap trend", opened:A(t, -45), owner:"", due:A(t, -5), problem:"Example data", containment:"Parts sorted", why:["Tool offset not updated","","","",""], rootCause:"", actions:[], closed:"", effDue:"", effMethod:"", effResult:"", effNote:"" };
    var c2 = { id:uid(), no:"", title:"Example: wrong revision at machine", source:"Internal audit", opened:A(t, -120), owner:"", due:A(t, -80), problem:"Example data", containment:"Replaced drawing", why:["","","","",""], rootCause:"No check of revision at job release", actions:[{ text:"Add revision check to job release", owner:"", due:A(t, -90), done:true }], closed:A(t, -75), effDue:A(t, -15), effMethod:"", effResult:"", effNote:"" };
    capaStore(c1); capaStore(c2);
    D.objectives = [{ id:uid(), name:"Example: on-time delivery", target:"95", actual:"92", unit:"%", dir:"min" }];
    save(); toast("Example data loaded — delete it from Review › Your data when you start for real.");
  }

  function render(){
    renderToday();
    if(view === "capa") renderCapa(); else badge("bCapa", D.capas.filter(function(c){ return !c.closed && c.due && QCMD.days(c.due, T()) > 0; }).length);
    if(view === "audit") renderAudit(); else badge("bAudit", D.program.filter(function(p){ return !p.last || QCMD.days(QCMD.nextDue(p.last, p.freq), T()) > 0; }).length);
    if(view === "due") renderDue(); else badge("bDue", D.dues.filter(function(d){ var nd = QCMD.nextDue(d.last, d.freq); return !nd || QCMD.days(nd, T()) > 0; }).length);
    if(view === "review") renderReview();
  }
  load(); render();
  if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
