<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- SPC Tools home icon: "Out of Control" — control-chart trace breaching the upper limit.
       ACCENT SWAP: the accent colour appears ONLY in the <style> block below as #4DA3FF.
       To change the accent, replace #4DA3FF (2 occurrences, both in <style>) with the new hex.
       Background #0C0E10 and limit grey #9AA4AE are fixed supporting tones. -->
  <style>
    .acc-s { stroke: #4DA3FF; }
    .acc-f { fill: #4DA3FF; }
    .lim   { stroke: #9AA4AE; }
  </style>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#0C0E10"/>
  <!-- control limits (dashed) and centre line -->
  <line class="lim" x1="208" y1="330" x2="816" y2="330" stroke-width="34" stroke-dasharray="76 40" stroke-linecap="round"/>
  <line class="lim" x1="208" y1="694" x2="816" y2="694" stroke-width="34" stroke-dasharray="76 40" stroke-linecap="round"/>
  <line class="lim" x1="208" y1="512" x2="816" y2="512" stroke-width="18" opacity="0.45"/>
  <!-- data trace: in control until the final point breaches the upper limit -->
  <polyline class="acc-s" points="208,566 336,438 464,604 592,474 720,548 816,240" fill="none" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- breach dot, separated by a background halo -->
  <circle cx="816" cy="240" r="88" fill="#0C0E10"/>
  <circle class="acc-f" cx="816" cy="240" r="62"/>
</svg>
